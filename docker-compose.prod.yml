services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: tfm-airports-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/tfm_airports
      REDIS_URL: redis://redis:6379
      SHARE_TTL_SECONDS: 86400
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    container_name: tfm-airports-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: tfm-airports-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:

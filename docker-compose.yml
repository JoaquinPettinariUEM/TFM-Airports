services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tfm-airports-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/tfm_airports
      REDIS_URL: redis://redis:6379
      SHARE_TTL_SECONDS: 86400
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    container_name: tfm-airports-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: tfm-airports-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
